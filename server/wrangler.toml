name = "spare-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# Required by @cloudflare/vitest-pool-workers, which needs Node built-ins to run
# the test runner inside workerd. The Worker's own code uses only WebCrypto and
# the fetch API, so this widens what tests can do rather than what production
# depends on.
compatibility_flags = ["nodejs_compat"]

# Non-secret only. Keys live in `wrangler secret put` and never in the repo.
[vars]
BUNDLE_ID = "app.spare.ios"

# Lowered from 50 for the pre-release window. The six-lesson probe costs about
# $1 and the full 20-lesson batch about $3, so $15 leaves room for a batch that
# retries every lesson twice and still stops well short of a month's worth of
# an open endpoint. Raise it when the app ships and real subscribers depend on
# free generation not pausing.
MONTHLY_SPEND_CEILING_USD = "15"

# "false" makes POST /v1/trial/start 404. It is off because the Worker goes
# live weeks before any client exists, and until then a public trial endpoint
# is a premium-pool entitlement anybody can claim with one curl. Flip to "true"
# in the deploy that accompanies the first TestFlight build.
TRIAL_START_ENABLED = "false"

[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageCounter"

[[durable_objects.bindings]]
name = "SPEND"
class_name = "SpendLedger"

[[durable_objects.bindings]]
name = "FUNNEL"
class_name = "FunnelLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter", "SpendLedger"]

# Five global integers behind the reverse trial's one decision number. No
# device identifiers and no per-user rows -- see `FunnelLedger`.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["FunnelLedger"]

# Workers-level rate limiting: 30 requests a minute per IP.
#
# A stopgap, and weaker than the WAF rate-limiting rules it stands in for.
# Those run at Cloudflare's edge and refuse a request before it reaches any
# Worker; this one is checked *inside* the Worker, so a blocked request has
# already been routed, billed as an invocation, and given a chance to run. It
# also counts per colo rather than globally, so the real ceiling is somewhat
# above 30. Replace it with a WAF rule once the proxy is on a domain -- see
# "Rate limiting" in DEPLOY.md.
#
# `period` accepts only 10 or 60. 60 with a limit of 30 is the requested
# 30/minute; there is no way to express a smoother 5-per-10-seconds.
#
# `namespace_id` is a string that names the counter, not a resource to create.
# Changing it resets every count, which is the only way to clear a limit.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[kv_namespaces]]
binding = "LESSONS"
id = "9f9666e87aa04162b04dd97b9edc363f"
