name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

# Cancel superseded runs on the same branch; macOS minutes are the scarce resource.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: SpareCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # SpareCore must stay platform-agnostic: it is the part of the codebase
      # that can be compiled and tested without a Mac. An Apple-only import
      # sneaking in here is what silently ends that, so fail loudly.
      # Portable POSIX sh: this job runs in a container whose default shell is
      # dash, so no `pipefail` and no process substitution.
      - name: Reject Apple-only imports in SpareCore
        run: |
          set -u
          # `([^A-Za-z0-9_]|$)` is a portable word boundary: it still catches
          # `import UIKit.UIView` while leaving a hypothetical `UIKitCore` alone.
          banned='^[[:space:]]*(@_exported[[:space:]]+)?import[[:space:]]+(SwiftUI|SwiftData|StoreKit|UIKit|AppKit|WidgetKit|AppIntents|UserNotifications|CoreData|Combine|Darwin|ObjectiveC)([^A-Za-z0-9_]|$)'
          if grep -rEn --include='*.swift' "$banned" SpareCore/Sources SpareCore/Tests; then
            echo "::error::SpareCore must not import Apple-only frameworks (see matches above)."
            exit 1
          fi
          echo "OK: no Apple-only imports in SpareCore."

      # Every persisted preference has to go through `AppSettingsKey`, which is
      # `CaseIterable` and therefore resettable by construction. This is the
      # other half: the enum alone cannot stop somebody writing a raw literal
      # at a call site, and a key that never reaches the registry is a key
      # `-UITEST_RESET_STATE` will not clear. That is not hypothetical -- the
      # trial's four flags were added straight to `@AppStorage` and the second
      # and third launches of a UI test ran on the first one's leftovers.
      #
      # Deliberately not a Swift test: nothing can enumerate every
      # `@AppStorage` key in a module at runtime. `AppStorage` does not expose
      # its key, and `Mirror` would need an instance of every view that
      # declares one. A source scan is the closest thing that actually holds,
      # and it runs here on Linux rather than waiting for the macOS job.
      - name: Every persisted key goes through AppSettingsKey
        run: |
          set -u
          status=0

          # Comment lines are dropped throughout: a comment cannot persist
          # anything, and the documentation in AppSettings.swift necessarily
          # quotes the patterns being banned. `:[0-9]+: *//` matches the
          # content half of grep's `file:line:content` output.
          drop_comments() { grep -vE ':[0-9]+: *//' || true; }

          # 1. No string literal may name a defaults key.
          literals=$(grep -rEn --include='*.swift' '@AppStorage\("' Spare | drop_comments)
          if [ -n "$literals" ]; then
            echo "$literals"
            echo "::error::@AppStorage must take an AppSettingsKey case, not a string literal."
            status=1
          fi
          literals=$(grep -rEn --include='*.swift' 'forKey: *"' Spare | drop_comments)
          if [ -n "$literals" ]; then
            echo "$literals"
            echo "::error::forKey: must take an AppSettingsKey case, not a string literal."
            status=1
          fi

          # 2. And no indirection past it either. Every `forKey:` in the app
          #    must name the registry, except the two allowlisted below.
          #
          #    `DeviceIdentity` is excluded on purpose: its identifier lives in
          #    the App Group suite, is not an app setting, and clearing it on a
          #    UI-test reset would hand every launch a new device and a fresh
          #    free allowance -- the opposite of a clean slate. `AppSettings`
          #    itself is the file that does the unwrapping.
          offenders=$(
            grep -rEn --include='*.swift' 'forKey:' Spare \
              | grep -v 'AppSettingsKey' \
              | grep -v '^Spare/App/DeviceIdentity.swift:' \
              | grep -v '^Spare/Theme/AppSettings.swift:' \
              | drop_comments \
              || true
          )
          if [ -n "$offenders" ]; then
            echo "$offenders"
            echo "::error::a defaults key bypasses AppSettingsKey (see matches above)."
            status=1
          fi

          [ "$status" -eq 0 ] && echo "OK: every persisted key goes through AppSettingsKey."
          exit "$status"

      # `canImport(Darwin)` is allowed for platform-conditional bodies, but the
      # FoundationNetworking shim must accompany any URLSession use.
      - name: Check FoundationNetworking guard on networking files
        run: |
          set -u
          unguarded=$(
            grep -rEl --include='*.swift' 'URLSession' SpareCore/Sources 2>/dev/null \
            | while IFS= read -r file; do
                grep -q 'canImport(FoundationNetworking)' "$file" || printf '%s\n' "$file"
              done
          )
          if [ -n "$unguarded" ]; then
            printf '%s\n' "$unguarded" | while IFS= read -r file; do
              echo "::error file=$file::uses URLSession without a #if canImport(FoundationNetworking) import"
            done
            exit 1
          fi
          echo "OK: networking files are guarded."

      # The API key belongs in one place: the user's Keychain. Not in source,
      # not in a fixture, not in CI secrets. This fails on anything shaped
      # like a real key, while allowing the obvious placeholders tests use.
      - name: Reject committed API keys
        run: |
          set -u
          if grep -rEn --include='*.swift' --include='*.yml' --include='*.plist' --include='*.json' \
               'sk-ant-[A-Za-z0-9_-]{16,}' . \
             | grep -v 'sk-ant-fixture' \
             | grep -v 'sk-ant-test'; then
            echo "::error::Something shaped like a real Anthropic API key is committed."
            exit 1
          fi
          echo "OK: no committed API keys."

      - name: Build
        run: swift build --package-path SpareCore

      - name: Test
        run: swift test --package-path SpareCore

  server:
    name: Proxy (Node)
    runs-on: ubuntu-latest
    # Independent of the Swift jobs: a server change shouldn't wait on an
    # iOS build, and a Swift change shouldn't wait on npm.
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: wrangler 4 and miniflare 5 require it, and the runner
      # deprecation notice on 20 is a second reason not to pin to it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm ci` now that the first deploy produced a lockfile. It installs the
      # exact tree that was deployed rather than whatever resolves today, so a
      # dependency publishing a broken patch release fails here as a changed
      # lockfile rather than as a mystery test failure. It also fails loudly if
      # the lockfile and package.json ever disagree.
      - name: Install
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      # The proxy holds the API key, so a key-shaped string reaching the repo
      # is worse here than anywhere else. Same guard as SpareCore's.
      - name: Reject committed secrets in the server
        working-directory: server
        run: |
          set -u
          # Matches key *material*, not the words around it. An earlier version
          # matched the bare string "BEGIN PRIVATE KEY" and so failed on
          # appstore.ts, which contains that marker because it strips it while
          # parsing a PEM. A guard that fires on the parser is a guard that gets
          # switched off, so: an Anthropic key shape, or a PEM body line (60+
          # base64 characters alone on a line, which is what actual key bytes
          # look like at PEM's 64-column wrap).
          patterns='sk-ant-[A-Za-z0-9_-]{16,}|^[A-Za-z0-9+/]{60,}={0,2}$'
          # Two steps rather than a pipeline, so the allowed fixtures are
          # filtered out without a line continuation to get mangled.
          # node_modules is present by now (install runs first) and is full of
          # base64 blobs and vendored certificates that would trip the PEM-body
          # pattern. Only our own files are in scope.
          found=$(grep -rEn --exclude-dir=node_modules --exclude-dir=.wrangler --include='*.ts' --include='*.toml' --include='*.json' "$patterns" . || true)
          found=$(echo "$found" | grep -v 'sk-ant-fixture' | grep -v 'test/fixtures.ts' || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::Something shaped like a real secret is committed in server/."
            exit 1
          fi
          echo "OK: no committed secrets in server/."

      # Runs the Worker in the real workerd runtime with real Durable Objects,
      # so the consistency guarantee the tier limits depend on is exercised
      # rather than mocked. Every upstream host is a fixture handler; a test
      # that reaches the network throws instead of passing.
      - name: Test
        working-directory: server
        run: npm test

  ios:
    name: Spare (iOS)
    runs-on: macos-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      # Printed before the build so a destination failure is diagnosable from
      # the log alone rather than needing a rerun.
      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show scheme
        run: xcodebuild -list -project Spare.xcodeproj

      # Resolve a concrete simulator UDID from the runner's actual device list
      # instead of hardcoding a device name that may not exist on the image.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | python3 .github/scripts/pick_simulator.py)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Using simulator $udid"

      - name: Build and test
        run: |
          set -uo pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            formatter=(xcbeautify --renderer github-actions)
          else
            formatter=(cat)
          fi
          # `tee` a raw, unformatted copy alongside the beautified stream:
          # xcbeautify's job is reformatting build/test output, and it is not
          # guaranteed to pass through plain print()/NSLog lines a test
          # writes to stdout, so the raw log is the reliable place to look
          # for anything a test explicitly printed.
          xcodebuild test \
            -project Spare.xcodeproj \
            -scheme Spare \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee raw-test-output.log \
            | "${formatter[@]}"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild test failed with status $status"
          fi
          exit "$status"

      - name: Show anything the tests printed directly
        if: always()
        run: |
          set -u
          if [ -f raw-test-output.log ] && grep -q 'accessibility tree' raw-test-output.log; then
            echo "::group::Test-printed accessibility tree diagnostics"
            # Every dumped tree, not just the first: the launch dump plus one
            # per wait/tap failure (see ScreenshotWalkthroughUITests'
            # printHierarchy), each bounded by its own start/end marker line.
            awk '/accessibility tree at (launch|failure)/{on=1} on{print} /end .* accessibility tree/{on=0}' raw-test-output.log
            echo "::endgroup::"
          else
            echo "No test-printed accessibility tree diagnostics found in raw output."
          fi

      - name: Upload raw test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-output
          path: raw-test-output.log
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore

      # ScreenshotWalkthroughUITests attaches a screenshot at every step of
      # onboarding -> Home -> Suggestions -> Reader -> Completion -> Library,
      # in both light and dark mode. xcparse pulls those attachments out of
      # the .xcresult bundle as plain PNGs -- this is the primary way to
      # review UI changes without a Mac, so it runs even if a test failed.
      - name: Install xcparse
        if: always()
        run: brew install chargepoint/xcparse/xcparse

      - name: Extract screenshots from test results
        if: always()
        run: |
          set -u
          if [ -d TestResults.xcresult ]; then
            xcparse screenshots TestResults.xcresult Screenshots \
              || echo "::warning::xcparse could not extract screenshots"
          else
            echo "::warning::no TestResults.xcresult present; skipping screenshot extraction"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: Screenshots
          if-no-files-found: warn
