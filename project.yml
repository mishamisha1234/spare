name: Spare
options:
  bundleIdPrefix: app.spare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SpareCore:
    path: SpareCore
targets:
  Spare:
    type: application
    platform: iOS
    sources:
      # Info.plist is generated by XcodeGen at this path; excluding it keeps it
      # from also being picked up as a bundle resource.
      - path: Spare
        excludes:
          - Info.plist
          - Spare.entitlements
      # Compiled into both the app and the widget: the App Group identifier
      # and the deep-link contract have to agree across the process boundary,
      # and one shared file is what guarantees they do.
      - path: Shared
    dependencies:
      - package: SpareCore
        product: SpareCore
      - target: SpareWidget
        embed: true
    info:
      path: Spare/Info.plist
      properties:
        CFBundleDisplayName: Spare
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # The proxy that holds the Anthropic key. A plist value rather than a
        # constant so a redeploy to a different Worker doesn't need a code
        # change — and so this file records the one piece of the server's
        # identity the app is allowed to know. The key itself is a Cloudflare
        # secret and appears nowhere in this repo.
        SPProxyBaseURL: https://spare-proxy.mishabichashvili1998.workers.dev
        # The pre-release gate. Every /v1/* endpoint except /v1/status answers
        # 404 without it. Supplied from the SPARE_CLIENT_TOKEN build setting,
        # never written here: this repository is public, and a literal would
        # publish the token on push. See Shared/SpareClient.swift.
        SpareClientToken: $(SPARE_CLIENT_TOKEN)
        # Registers the scheme the widget's links use.
        CFBundleURLTypes:
          - CFBundleURLName: app.spare.ios.deeplink
            CFBundleURLSchemes: [spare]
    entitlements:
      path: Spare/Spare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.spare.ios
        GENERATE_INFOPLIST_FILE: NO
        # Empty by default. Overridden by an untracked Local.xcconfig, or on
        # the command line: xcodebuild SPARE_CLIENT_TOKEN=... An empty value
        # means the header is omitted, which CI needs -- it builds and tests
        # without ever reaching the Worker.
        SPARE_CLIENT_TOKEN: ""
        SWIFT_UPCOMING_FEATURE_CONCURRENCY: YES
  SpareWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SpareWidget
        excludes:
          - SpareWidget.entitlements
      - path: Shared
      # The widget reads the same SwiftData store, so it needs the same
      # model definitions. Only the persistence layer — none of the app's
      # views or view models come across.
      - path: Spare/Persistence
    dependencies:
      - package: SpareCore
        product: SpareCore
    info:
      path: SpareWidget/Info.plist
      properties:
        CFBundleDisplayName: Spare
        # Present for parity with the app: the widget reads the shared store
        # and makes no proxy calls today, but it links SpareCore and would
        # need this the moment it did.
        SpareClientToken: $(SPARE_CLIENT_TOKEN)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SpareWidget/SpareWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.spare.ios.widget
        GENERATE_INFOPLIST_FILE: NO
        SPARE_CLIENT_TOKEN: ""
        SWIFT_UPCOMING_FEATURE_CONCURRENCY: YES
  SpareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpareTests
    dependencies:
      - target: Spare
      - package: SpareCore
        product: SpareCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SpareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpareUITests
    dependencies:
      - target: Spare
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Spare
schemes:
  Spare:
    build:
      targets:
        Spare: all
        SpareTests: [test]
        SpareUITests: [test]
    run:
      config: Debug
      # Local StoreKit testing only — lets a Mac run the paywall against
      # Products.storekit with no App Store Connect setup and no real charge.
      # CI never depends on this: UI tests inject StubPurchaseStore instead.
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      targets:
        - SpareTests
        - SpareUITests
