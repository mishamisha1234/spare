name: Spare
options:
  bundleIdPrefix: app.spare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SpareCore:
    path: SpareCore
targets:
  Spare:
    type: application
    platform: iOS
    sources:
      # Info.plist is generated by XcodeGen at this path; excluding it keeps it
      # from also being picked up as a bundle resource.
      - path: Spare
        excludes:
          - Info.plist
          - Spare.entitlements
      # Compiled into both the app and the widget: the App Group identifier
      # and the deep-link contract have to agree across the process boundary,
      # and one shared file is what guarantees they do.
      - path: Shared
    dependencies:
      - package: SpareCore
        product: SpareCore
      - target: SpareWidget
        embed: true
    info:
      path: Spare/Info.plist
      properties:
        CFBundleDisplayName: Spare
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Registers the scheme the widget's links use.
        CFBundleURLTypes:
          - CFBundleURLName: app.spare.ios.deeplink
            CFBundleURLSchemes: [spare]
    entitlements:
      path: Spare/Spare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.spare.ios
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_UPCOMING_FEATURE_CONCURRENCY: YES
  SpareWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SpareWidget
        excludes:
          - SpareWidget.entitlements
      - path: Shared
      # The widget reads the same SwiftData store, so it needs the same
      # model definitions. Only the persistence layer — none of the app's
      # views or view models come across.
      - path: Spare/Persistence
    dependencies:
      - package: SpareCore
        product: SpareCore
    info:
      path: SpareWidget/Info.plist
      properties:
        CFBundleDisplayName: Spare
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SpareWidget/SpareWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.spare.ios.widget
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_UPCOMING_FEATURE_CONCURRENCY: YES
  SpareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpareTests
    dependencies:
      - target: Spare
      - package: SpareCore
        product: SpareCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SpareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpareUITests
    dependencies:
      - target: Spare
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Spare
schemes:
  Spare:
    build:
      targets:
        Spare: all
        SpareTests: [test]
        SpareUITests: [test]
    run:
      config: Debug
      # Local StoreKit testing only — lets a Mac run the paywall against
      # Products.storekit with no App Store Connect setup and no real charge.
      # CI never depends on this: UI tests inject StubPurchaseStore instead.
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      targets:
        - SpareTests
        - SpareUITests
