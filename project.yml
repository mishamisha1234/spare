name: Spare
options:
  bundleIdPrefix: app.spare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  SpareCore:
    path: SpareCore
targets:
  Spare:
    type: application
    platform: iOS
    sources:
      # Info.plist is generated by XcodeGen at this path; excluding it keeps it
      # from also being picked up as a bundle resource.
      - path: Spare
        excludes:
          - Info.plist
    dependencies:
      - package: SpareCore
        product: SpareCore
    info:
      path: Spare/Info.plist
      properties:
        CFBundleDisplayName: Spare
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.spare.ios
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_UPCOMING_FEATURE_CONCURRENCY: YES
  SpareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpareTests
    dependencies:
      - target: Spare
      - package: SpareCore
        product: SpareCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SpareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpareUITests
    dependencies:
      - target: Spare
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Spare
schemes:
  Spare:
    build:
      targets:
        Spare: all
        SpareTests: [test]
        SpareUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpareTests
        - SpareUITests
